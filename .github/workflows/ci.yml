name: Game checks
on:
  push:
    branches: ['**']
    paths: &game-check-paths
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'next.config.ts'
      - 'next-env.d.ts'
      - 'tsconfig.json'
      - 'eslint.config.mjs'
      - '.github/workflows/ci.yml'
      - '!**/*.md'
      - '!**/*.mdx'
  pull_request:
    paths: *game-check-paths
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
